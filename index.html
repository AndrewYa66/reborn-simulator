<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reborn Simulator - 投胎模擬器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 標題區 -->
    <header class="text-center mb-5">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-500">
            🎲 Reborn Simulator 投胎模擬器
        </h1>
        <p class="text-slate-400 text-xs sm:text-sm">
            跨歷史時代 × 全球國家 × 動態階級的首刷身分抽卡模擬器
        </p>
    </header>

    <!-- 選擇與篩選面板 -->
    <div class="w-full max-w-sm space-y-3 mb-5">
        <div>
            <label for="reborn-era-select" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 text-center">
                ⏳ 1. 選擇歷史時代 (Era)
            </label>
            <select id="reborn-era-select" onchange="rebornSim.onEraChange()" class="w-full bg-slate-800 border-2 border-purple-500/50 text-purple-200 text-xs sm:text-sm font-semibold rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-purple-400 transition cursor-pointer shadow-lg">
            </select>
            <p id="reborn-era-desc" class="text-[11px] text-slate-400 mt-1 text-center italic px-1">--</p>
        </div>

        <div>
            <label for="reborn-country-select" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 text-center">
                🌍 2. 選擇投胎國家/區域 (Country/Region)
            </label>
            <select id="reborn-country-select" onchange="rebornSim.onCountryChange()" class="w-full bg-slate-800 border-2 border-purple-500/50 text-purple-200 text-xs sm:text-sm font-semibold rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-purple-400 transition cursor-pointer shadow-lg">
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 text-center">
                👑 3. 限定動態社會階級 (Dynamic Social Class)
            </label>
            <div id="reborn-class-selector" class="grid grid-cols-4 gap-1 bg-slate-800 p-1 rounded-xl border border-slate-700 text-[11px]">
            </div>
        </div>
    </div>

    <!-- 卡牌顯示區 -->
    <main id="reborn-card-container" class="w-full max-w-sm bg-slate-800 border-2 border-slate-700 rounded-2xl p-6 shadow-2xl relative overflow-hidden transition-all duration-300 min-h-[440px] flex flex-col justify-between">
        
        <div id="reborn-placeholder-view" class="flex flex-col items-center justify-center h-full my-auto text-center py-12">
            <div id="reborn-placeholder-icon" class="text-6xl mb-4 opacity-50">🎰</div>
            <p class="text-slate-400 font-medium">準備好開啟新人生了嗎？</p>
            <p class="text-xs text-slate-500 mt-2">設定時代、國家與專屬階級後，點擊下方按鈕進行投胎</p>
        </div>

        <div id="reborn-result-view" class="hidden animate-pop-in flex flex-col h-full justify-between">
            <div>
                <div class="flex justify-between items-center mb-2">
                    <span id="reborn-card-tier" class="px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-slate-700 text-slate-300">TIER</span>
                    <span id="reborn-card-prob" class="text-xs text-slate-400 font-mono">條件機率: 0%</span>
                </div>

                <div class="text-center my-3">
                    <div id="reborn-card-flag" class="text-6xl mb-2">🚩</div>
                    <div class="flex justify-center items-center gap-1.5 flex-wrap mb-1">
                        <span id="reborn-card-era-badge" class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-900/80 text-amber-200 border border-amber-700/50">時代</span>
                        <span id="reborn-card-country-name" class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-700 text-slate-200">國家</span>
                        <span id="reborn-card-classname" class="px-2 py-0.5 rounded text-[10px] font-bold bg-purple-900/80 text-purple-200 border border-purple-700/50">階級</span>
                    </div>
                    <h2 id="reborn-card-title" class="text-2xl font-black text-white tracking-wide">身分/職位</h2>
                    <p id="reborn-card-hierarchy-path" class="text-xs text-purple-300 mt-1 font-mono">時代 ➔ 國家 ➔ 階級</p>
                </div>
            </div>

            <div class="bg-slate-900/60 rounded-xl p-3 space-y-1.5 border border-slate-700/50 my-3 text-xs">
                <div class="flex justify-between">
                    <span class="text-slate-400">🏥 醫療與壽命:</span>
                    <span id="reborn-attr-healthcare" class="font-bold text-slate-200">-</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">🛡️ 治安與安全:</span>
                    <span id="reborn-attr-safety" class="font-bold text-slate-200">-</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">💰 經濟與發展:</span>
                    <span id="reborn-attr-economy" class="font-bold text-slate-200">-</span>
                </div>
            </div>

            <div class="bg-purple-950/40 border border-purple-800/40 rounded-lg p-3 text-xs text-purple-200 leading-relaxed italic">
                <span class="font-bold not-italic">💬 命運評語：</span><span id="reborn-card-comment">...</span>
            </div>
        </div>
    </main>

    <!-- 操作按鈕區 -->
    <footer class="mt-6">
        <button id="reborn-gacha-btn" onclick="rebornSim.drawLife()" class="px-8 py-4 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-bold rounded-full shadow-lg transform transition active:scale-95 focus:outline-none focus:ring-4 focus:ring-purple-500/50 text-lg">
            開始投胎 (抽卡)
        </button>
    </footer>

    <!-- 依序載入獨立模組 -->
    <script src="reborn-database.js"></script>
    <script src="reborn-simulator.js"></script>
    <script>
        window.onload = function() {
            rebornSim.init();
        };
    </script>
</body>
</html>
